<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Élan Fitness</title>
  <link rel="stylesheet" href="style_contact.css">
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <p>If you have any questions or inquiries, please fill out the form below and we will get back to you as soon as possible.</p>
    <div class="contact-box">
      <div class="contact_left">
        <h3>Send your request </h3>
        <form>
          <div class="input-row">
            <div class="input-group">
              <label>Name</label>
              <input type="text" placeholder="Eter your Name ">
            </div>
             <div class="input-group">
              <label>Phone Number</label>
              <input type="text" placeholder="+212 123456 ">
            </div>
          </div>

          <div class="input-row">       
              <div class="input-group">
              <label>Email</label>
              <input type="text" placeholder="ABCD123@gmail.com ">
            </div>
             <div class="input-group">
              <label>Subject</label>
              <input type="text" placeholder="Prodact Demo ">
            </div>
          </div>
          <label>Messege</label>
          <textarea rows="5"placeholder="Your Message "></textarea>
          <button type="submit">SEND</button>
          

        </form>


      </div>
      <div class="contact_right">
        <h3> Reach Us </h3>
      <table> 
        <tr>
          <td>Email</td>
          <td> contactus@gmaol.com </td>
        </tr>
        <tr>
          <td>Phone</td>
          <td>+212 63245696</td>
        </tr>
         <tr>
          <td>Adresse</td>
          <td>#123, Casablanca</td>
        </tr>
      </table>  


      </div>
      
    </div>    
  </div>







</body>
</html>
